<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f0">
  <title>文档问答 · RAG</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><span>文档问答</span></div>
      <span class="badge">本地知识库 · RAG</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">ASK YOUR DOCUMENTS</p>
      <h1 id="page-title">从你的文档中找到答案。</h1>
      <p class="lead">输入一个问题，系统会从本地索引中检索相关片段，并基于这些资料回答。</p>
    </section>

    <section class="workspace" aria-label="提问工作区">
      <div class="question-panel">
        <form id="ask-form">
          <label class="field-label" for="question">你的问题</label>
          <textarea id="question" name="question" rows="5" maxlength="1000" required placeholder="例如：文档中关于项目部署有哪些要求？"></textarea>
          <div class="options">
            <label class="option" for="use-rerank">
              <input id="use-rerank" type="checkbox" checked>
              <span class="option-copy"><strong>启用重排</strong><small>对召回片段再次排序</small></span>
            </label>
            <label class="option" for="retrieval-only">
              <input id="retrieval-only" type="checkbox">
              <span class="option-copy"><strong>仅看检索</strong><small>不调用聊天模型</small></span>
            </label>
          </div>
          <button id="submit-button" class="submit" type="submit"><span>开始提问</span><span aria-hidden="true">↗</span></button>
          <p id="status" class="status" role="status" aria-live="polite">先用 <code>uv run rerank-rag index</code> 建立索引。</p>
        </form>
      </div>

      <div id="result-panel" class="result-panel" aria-live="polite">
        <div id="empty-state" class="empty-state">
          <div class="empty-icon" aria-hidden="true">⌕</div>
          <h2>答案会出现在这里</h2>
          <p>你可以查看生成的回答，以及它依据的文档片段。</p>
        </div>
        <div id="result-content" hidden>
          <div id="answer-section" class="answer-section">
            <p class="section-kicker">回答</p>
            <div id="answer" class="answer"></div>
          </div>
          <div class="source-heading"><div><p class="section-kicker">来源</p><h2>检索片段 <span id="source-count"></span></h2></div></div>
          <div id="sources" class="sources"></div>
        </div>
      </div>
    </section>
    <footer>答案由检索片段生成；请以原始文档为准。</footer>
  </main>
</body>
</html>
