[project]
name = "rerank-rag"
version = "0.1.0"
description = "支持向量检索与可选重排的本地文档 RAG 问答项目"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb",
    "docling>=2.150.1",
    "openai",
    "python-dotenv",
    "requests",
    "sentence-transformers",
    "torch",
]

[project.scripts]
rerank-rag = "rerank_rag.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
